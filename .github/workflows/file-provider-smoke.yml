name: File Provider Smoke

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-file-provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    environment: nightly
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26.6'
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.8.4'
          cache: true
      - uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3.0.0
        with:
          p12-file-base64: ${{ secrets.SMOKE_DEVELOPMENT_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.SMOKE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      - name: Download exact macOS development host profile
        uses: apple-actions/download-provisioning-profiles@7fa56f793274ba880be33b875dae5fe62519bc11 # v4.0.1
        with:
          bundle-id: ch.benavo.mountli
          profile-type: MAC_APP_DEVELOPMENT
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY_PEM }}
      - name: Download exact macOS development File Provider profile
        uses: apple-actions/download-provisioning-profiles@7fa56f793274ba880be33b875dae5fe62519bc11 # v4.0.1
        with:
          bundle-id: ch.benavo.mountli.fileprovider.macos
          profile-type: MAC_APP_DEVELOPMENT
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY_PEM }}
      - name: Download exact macOS development File Provider UI profile
        uses: apple-actions/download-provisioning-profiles@7fa56f793274ba880be33b875dae5fe62519bc11 # v4.0.1
        with:
          bundle-id: ch.benavo.mountli.fileproviderui.macos
          profile-type: MAC_APP_DEVELOPMENT
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY_PEM }}
      - name: Decode protected signed smoke driver
        env:
          SMOKE_DRIVER_BASE64: ${{ secrets.SMOKE_DRIVER_BASE64 }}
        run: |
          : "${SMOKE_DRIVER_BASE64:?A reviewed signed smoke driver is required}"
          mkdir -p .build/smoke
          printf '%s' "$SMOKE_DRIVER_BASE64" | base64 --decode > .build/smoke/mountli-smoke-driver
          chmod 700 .build/smoke/mountli-smoke-driver
          codesign --verify --strict --verbose=2 .build/smoke/mountli-smoke-driver
      - name: Archive signed host and embedded extensions
        env:
          MOUNTLI_ENCRYPTION_EXPORT_COMPLIANCE_CODE: ${{ secrets.MOUNTLI_ENCRYPTION_EXPORT_COMPLIANCE_CODE }}
        run: |
          mise exec -- make generate
          xcodebuild archive -project MOUNTLI.xcodeproj -scheme MOUNTLI-macOS -configuration Release \
            -archivePath .build/smoke/MOUNTLI.xcarchive \
            MOUNTLI_ENCRYPTION_EXPORT_COMPLIANCE_CODE="$MOUNTLI_ENCRYPTION_EXPORT_COMPLIANCE_CODE"
      - name: Exercise real domain and WebDAV fixture
        env:
          MOUNTLI_SMOKE_APP: ${{ github.workspace }}/.build/smoke/MOUNTLI.xcarchive/Products/Applications/MOUNTLI.app
          MOUNTLI_SMOKE_DRIVER: ${{ github.workspace }}/.build/smoke/mountli-smoke-driver
          MOUNTLI_TEST_WEBDAV_URL: ${{ secrets.SMOKE_WEBDAV_URL }}
          MOUNTLI_TEST_WEBDAV_USERNAME: ${{ secrets.SMOKE_WEBDAV_USERNAME }}
          MOUNTLI_TEST_WEBDAV_PASSWORD: ${{ secrets.SMOKE_WEBDAV_PASSWORD }}
        run: ./Scripts/smoke-file-provider.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: signed-smoke-diagnostics-${{ github.run_id }}
          path: |
            .build/smoke/*.log
            ~/Library/Logs/DiagnosticReports/MOUNTLI*
          if-no-files-found: ignore
          retention-days: 7
      - name: Always remove domain, fixture state, profiles, and signing material
        if: always()
        env:
          MOUNTLI_SMOKE_APP: ${{ github.workspace }}/.build/smoke/MOUNTLI.xcarchive/Products/Applications/MOUNTLI.app
          MOUNTLI_SMOKE_DRIVER: ${{ github.workspace }}/.build/smoke/mountli-smoke-driver
        run: |
          if [[ -x "$MOUNTLI_SMOKE_DRIVER" ]]; then "$MOUNTLI_SMOKE_DRIVER" cleanup --app "$MOUNTLI_SMOKE_APP" || true; fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.{mobileprovision,provisionprofile}
          rm -rf .build/smoke
