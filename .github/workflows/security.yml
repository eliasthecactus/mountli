name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '21 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.8.4'
          cache: true
      - name: Install pinned Go helper tools
        run: mise exec -- mise run bootstrap-go-tools
      - name: Verify module checksums
        working-directory: GoBridge
        run: go mod verify
      - name: Scan reachable Go vulnerabilities
        working-directory: GoBridge
        run: mise exec -- govulncheck ./...
      - name: Verify complete license allow-list and bundled texts
        run: mise exec -- ./Scripts/verify-licenses.sh
      - name: Scan repository history for secrets
        run: mise exec -- gitleaks git --redact --no-banner .
      - name: Scan working tree for secrets
        run: mise exec -- gitleaks dir --redact --no-banner .
      - name: Generate deterministic CycloneDX source SBOMs
        run: mise exec -- ./Scripts/generate-sboms.sh .build/security-sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom-${{ github.sha }}
          path: .build/security-sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 90

  codeql:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26.6'
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.8.4'
          cache: true
      - uses: github/codeql-action/init@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
        with:
          languages: go,swift
      - name: Build analyzed products
        run: |
          mise exec -- make generate
          xcodebuild -project MOUNTLI.xcodeproj -scheme MOUNTLI-macOS -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@60168efe1c415ce0f5521ea06d5c2062adbeed1b # v3.28.17
