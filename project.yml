name: MOUNTLI
options:
  bundleIdPrefix: ch.benavo.mountli
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  MountliCore:
    path: Packages/MountliCore
  MountliFileProvider:
    path: Packages/MountliFileProvider
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
    DEVELOPMENT_TEAM: 3THXLGMP36
    MOUNTLI_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)ch.benavo.mountli.shared
    MOUNTLI_RCLONE_VERSION: "1.75.2"
targets:
  MOUNTLI-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: ThirdPartyLicenses
        buildPhase: resources
        type: folder
    dependencies:
      - package: MountliCore
        product: MountliCore
      - target: MountliFileProvider-macOS
        embed: true
      - target: MountliRecovery-macOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli
        PRODUCT_NAME: Mountli
        INFOPLIST_FILE: Config/Info/Mountli-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Mountli-macOS.entitlements
        INFOPLIST_KEY_MOUNTLIKeychainAccessGroup: $(MOUNTLI_KEYCHAIN_ACCESS_GROUP)
        INFOPLIST_KEY_MOUNTLIRcloneVersion: $(MOUNTLI_RCLONE_VERSION)
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
  MOUNTLI-macOS-Direct:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: ThirdPartyLicenses
        buildPhase: resources
        type: folder
    dependencies:
      - package: MountliCore
        product: MountliCore
      - package: Sparkle
        product: Sparkle
      - target: MountliFileProvider-macOS-Direct
        embed: true
      - target: MountliRecovery-macOS-Direct
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli
        PRODUCT_NAME: Mountli
        INFOPLIST_FILE: Config/Info/Mountli-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Mountli-macOS.entitlements
        INFOPLIST_KEY_MOUNTLIKeychainAccessGroup: $(MOUNTLI_KEYCHAIN_ACCESS_GROUP)
        INFOPLIST_KEY_MOUNTLIRcloneVersion: $(MOUNTLI_RCLONE_VERSION)
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) MOUNTLI_DIRECT
  MOUNTLI-iOS:
    type: application
    platform: iOS
    sources:
      - path: App/Shared
      - path: App/iOS
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: ThirdPartyLicenses
        buildPhase: resources
        type: folder
    dependencies:
      - package: MountliCore
        product: MountliCore
      - target: MountliFileProvider-iOS
        embed: true
      - target: MountliRecovery-iOS
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli
        PRODUCT_NAME: Mountli
        INFOPLIST_FILE: Config/Info/Mountli-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/Mountli-iOS.entitlements
        INFOPLIST_KEY_MOUNTLIKeychainAccessGroup: $(MOUNTLI_KEYCHAIN_ACCESS_GROUP)
        INFOPLIST_KEY_MOUNTLIRcloneVersion: $(MOUNTLI_RCLONE_VERSION)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  MountliFileProvider-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: App/Extensions/FileProvider
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MountliFileProvider
        product: MountliFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.fileprovider.macos
        PRODUCT_NAME: MountliFileProviderExtension
        INFOPLIST_FILE: Config/Info/FileProvider-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/FileProvider-macOS.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  MountliFileProvider-macOS-Direct:
    type: app-extension
    platform: macOS
    sources:
      - path: App/Extensions/FileProvider
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MountliFileProvider
        product: MountliFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.fileprovider.macos
        PRODUCT_NAME: MountliFileProviderExtension
        INFOPLIST_FILE: Config/Info/FileProvider-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/FileProvider-macOS.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  MountliFileProvider-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Extensions/FileProvider
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MountliFileProvider
        product: MountliFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.fileprovider.ios
        PRODUCT_NAME: MountliFileProviderExtension
        INFOPLIST_FILE: Config/Info/FileProvider-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/FileProvider-iOS.entitlements
        SKIP_INSTALL: YES
  MountliRecovery-macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: App/Extensions/FileProviderUI
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.fileproviderui.macos
        PRODUCT_NAME: MountliRecovery
        INFOPLIST_FILE: Config/Info/FileProviderUI-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/FileProviderUI-macOS.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  MountliRecovery-macOS-Direct:
    type: app-extension
    platform: macOS
    sources:
      - path: App/Extensions/FileProviderUI
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.fileproviderui.macos
        PRODUCT_NAME: MountliRecovery
        INFOPLIST_FILE: Config/Info/FileProviderUI-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/FileProviderUI-macOS.entitlements
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
  MountliRecovery-iOS:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Extensions/FileProviderUI
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.fileproviderui.ios
        PRODUCT_NAME: MountliRecovery
        INFOPLIST_FILE: Config/Info/FileProviderUI-iOS.plist
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/FileProviderUI-iOS.entitlements
        SKIP_INSTALL: YES
  MountliCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/MountliCore/Tests/MountliCoreTests
    dependencies:
      - package: MountliCore
        product: MountliCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.tests.core
        GENERATE_INFOPLIST_FILE: YES
  MountliFileProviderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/MountliFileProvider/Tests/MountliFileProviderTests
    dependencies:
      - package: MountliFileProvider
        product: MountliFileProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.tests.fileprovider
        GENERATE_INFOPLIST_FILE: YES
  MountliUITests-macOS:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: MOUNTLI-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.tests.ui.macos
        GENERATE_INFOPLIST_FILE: YES
  MountliUITests-iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MOUNTLI-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.benavo.mountli.tests.ui.ios
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MOUNTLI-macOS:
    build:
      targets:
        MOUNTLI-macOS: all
        MountliCoreTests: [test]
        MountliFileProviderTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MountliCoreTests
        - MountliFileProviderTests
        - MountliUITests-macOS
    archive:
      config: Release
  MOUNTLI-macOS-Direct:
    build:
      targets:
        MOUNTLI-macOS-Direct: all
    run:
      config: Debug
    archive:
      config: Release
  MOUNTLI-iOS:
    build:
      targets:
        MOUNTLI-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MountliUITests-iOS
    archive:
      config: Release
